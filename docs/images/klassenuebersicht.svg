<svg xmlns="http://www.w3.org/2000/svg" width="920" height="480" viewBox="0 0 920 480">
  <style>
    .title { font: 700 24px sans-serif; fill: #102a43; }
    .box { fill: #f8fafc; stroke: #334e68; stroke-width: 2; }
    .head { fill: #d9e2ec; stroke: #334e68; stroke-width: 2; }
    .className { font: 700 20px sans-serif; fill: #102a43; }
    .section { font: 600 15px sans-serif; fill: #243b53; }
    .text { font: 14px monospace; fill: #334e68; }
    .arrow { stroke: #486581; stroke-width: 3; marker-end: url(#arrow); }
    .label { font: 14px sans-serif; fill: #486581; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#486581" />
    </marker>
  </defs>

  <rect x="0" y="0" width="100%" height="100%" fill="#000000" />
  <text x="30" y="40" class="title">Klassenübersicht</text>

  <rect x="50" y="80" width="320" height="220" class="box" />
  <rect x="50" y="80" width="320" height="45" class="head" />
  <text x="145" y="108" class="className">Application</text>
  <line x1="50" y1="125" x2="370" y2="125" stroke="#334e68" stroke-width="2" />
  <text x="70" y="155" class="section">Methoden</text>
  <text x="70" y="185" class="text">+ main(String[] args) : void</text>
  <line x1="50" y1="205" x2="370" y2="205" stroke="#334e68" stroke-width="2" />
  <text x="70" y="235" class="section">Aufgabe</text>
  <text x="70" y="262" class="text">Startet das Programm und verwendet</text>
  <text x="70" y="284" class="text">den Ringpuffer für das Beispiel.</text>

  <rect x="520" y="60" width="340" height="362" class="box" />
  <rect x="520" y="60" width="340" height="45" class="head" />
  <text x="630" y="89" class="className">Ringpuffer</text>
  <line x1="520" y1="105" x2="860" y2="105" stroke="#334e68" stroke-width="2" />
  <text x="540" y="135" class="section">Attribute</text>
  <text x="540" y="162" class="text">- KAPAZITAET : int = 6</text>
  <text x="540" y="184" class="text">- daten : int[]</text>
  <text x="540" y="206" class="text">- leseIndex : int</text>
  <text x="540" y="228" class="text">- schreibIndex : int</text>
  <text x="540" y="250" class="text">- anzahlElemente : int</text>
  <line x1="520" y1="265" x2="860" y2="265" stroke="#334e68" stroke-width="2" />
  <text x="540" y="292" class="section">Methoden</text>
  <text x="540" y="316" class="text">+ einfügen(int) : void</text>
  <text x="540" y="338" class="text">+ entnehmen() : int</text>
  <text x="540" y="360" class="text">+ istLeer() : boolean</text>
  <text x="540" y="382" class="text">+ istVoll() : boolean</text>
  <text x="540" y="404" class="text">+ groesse() : int</text>

  <line x1="370" y1="180" x2="520" y2="180" class="arrow" />
  <text x="410" y="168" class="label">verwendet</text>
</svg>
