<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300">
  <style>
    .title { font: 700 22px sans-serif; fill: #102a43; }
    .slot { fill: #fff7ed; stroke: #c05621; stroke-width: 2; }
    .slotOld { fill: #fde68a; stroke: #b45309; stroke-width: 2; }
    .idx { font: 700 16px sans-serif; fill: #7c2d12; }
    .val { font: 700 24px sans-serif; fill: #9a3412; }
    .text { font: 15px sans-serif; fill: #7c2d12; }
    .arrow { stroke: #1d4ed8; stroke-width: 3; marker-end: url(#arrowBlue); }
    .arrow2 { stroke: #15803d; stroke-width: 3; marker-end: url(#arrowGreen); }
  </style>
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1d4ed8" />
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#15803d" />
    </marker>
  </defs>

  <rect x="0" y="0" width="100%" height="100%" fill="#000000" />
  <text x="30" y="35" class="title">Beispiel: Nach dem Einfügen von 1 bis 8</text>

  <rect x="60" y="110" width="110" height="80" class="slotOld" />
  <rect x="170" y="110" width="110" height="80" class="slotOld" />
  <rect x="280" y="110" width="110" height="80" class="slot" />
  <rect x="390" y="110" width="110" height="80" class="slot" />
  <rect x="500" y="110" width="110" height="80" class="slot" />
  <rect x="610" y="110" width="110" height="80" class="slot" />

  <text x="108" y="140" class="idx">0</text>
  <text x="218" y="140" class="idx">1</text>
  <text x="328" y="140" class="idx">2</text>
  <text x="438" y="140" class="idx">3</text>
  <text x="548" y="140" class="idx">4</text>
  <text x="658" y="140" class="idx">5</text>

  <text x="108" y="175" class="val">7</text>
  <text x="218" y="175" class="val">8</text>
  <text x="328" y="175" class="val">3</text>
  <text x="438" y="175" class="val">4</text>
  <text x="548" y="175" class="val">5</text>
  <text x="658" y="175" class="val">6</text>

  <line x1="305" y1="75" x2="305" y2="103" class="arrow" />
  <text x="258" y="66" class="text">leseIndex</text>

  <line x1="225" y1="75" x2="225" y2="103" class="arrow2" />
  <text x="160" y="66" class="text">schreibIndex</text>

  <text x="60" y="225" class="text">Logische Reihenfolge beim Entnehmen: 3, 4, 5, 6, 7, 8</text>
  <text x="60" y="252" class="text">Die Werte 1 und 2 wurden bereits durch 7 und 8 ersetzt.</text>
</svg>
