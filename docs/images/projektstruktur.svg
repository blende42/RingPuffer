<svg xmlns="http://www.w3.org/2000/svg" width="860" height="280" viewBox="0 0 860 280">
  <style>
    .title { font: 700 22px sans-serif; fill: #102a43; }
    .label { font: 600 16px sans-serif; fill: #243b53; }
    .text { font: 14px sans-serif; fill: #334e68; }
    .box { fill: #f0f4f8; stroke: #486581; stroke-width: 2; rx: 12; }
    .folder { fill: #d9e2ec; stroke: #486581; stroke-width: 2; rx: 12; }
    .arrow { stroke: #829ab1; stroke-width: 3; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#829ab1" />
    </marker>
  </defs>

  <rect x="0" y="0" width="100%" height="100%" fill="#000000" />
  <text x="30" y="40" class="title">Projektstruktur</text>

  <rect x="30" y="70" width="220" height="80" class="folder" />
  <text x="50" y="105" class="label">src/.../ringpuffer</text>
  <text x="50" y="130" class="text">enthält Application.java</text>

  <rect x="330" y="70" width="220" height="80" class="folder" />
  <text x="350" y="105" class="label">puffer</text>
  <text x="350" y="130" class="text">enthält Ringpuffer.java</text>

  <rect x="610" y="70" width="210" height="80" class="box" />
  <text x="630" y="105" class="label">Ringpuffer</text>
  <text x="630" y="130" class="text">speichert 6 int-Werte</text>

  <line x1="250" y1="110" x2="330" y2="110" class="arrow" />
  <line x1="550" y1="110" x2="610" y2="110" class="arrow" />

  <rect x="120" y="180" width="240" height="60" class="box" />
  <text x="140" y="215" class="label">Application.main(...)</text>

  <rect x="480" y="180" width="260" height="60" class="box" />
  <text x="500" y="215" class="label">einfügen() / entnehmen()</text>

  <line x1="360" y1="210" x2="480" y2="210" class="arrow" />
</svg>
