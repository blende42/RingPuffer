<svg xmlns="http://www.w3.org/2000/svg" width="860" height="260" viewBox="0 0 860 260">
  <style>
    .title { font: 700 22px sans-serif; fill: #102a43; }
    .slot { fill: #f0f4f8; stroke: #486581; stroke-width: 2; }
    .idx { font: 700 16px sans-serif; fill: #243b53; }
    .val { font: 700 20px sans-serif; fill: #334e68; }
    .text { font: 15px sans-serif; fill: #486581; }
    .arrow { stroke: #d64545; stroke-width: 3; marker-end: url(#arrowRed); }
    .arrow2 { stroke: #2f855a; stroke-width: 3; marker-end: url(#arrowGreen); }
  </style>
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#d64545" />
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f855a" />
    </marker>
  </defs>

  <rect x="0" y="0" width="100%" height="100%" fill="#000000" />
  <text x="30" y="35" class="title">Ringpuffer mit 6 Speicherplätzen</text>

  <rect x="60" y="100" width="110" height="70" class="slot" />
  <rect x="170" y="100" width="110" height="70" class="slot" />
  <rect x="280" y="100" width="110" height="70" class="slot" />
  <rect x="390" y="100" width="110" height="70" class="slot" />
  <rect x="500" y="100" width="110" height="70" class="slot" />
  <rect x="610" y="100" width="110" height="70" class="slot" />

  <text x="108" y="128" class="idx">0</text>
  <text x="218" y="128" class="idx">1</text>
  <text x="328" y="128" class="idx">2</text>
  <text x="438" y="128" class="idx">3</text>
  <text x="548" y="128" class="idx">4</text>
  <text x="658" y="128" class="idx">5</text>

  <text x="100" y="158" class="val">int</text>
  <text x="210" y="158" class="val">int</text>
  <text x="320" y="158" class="val">int</text>
  <text x="430" y="158" class="val">int</text>
  <text x="540" y="158" class="val">int</text>
  <text x="650" y="158" class="val">int</text>

  <line x1="115" y1="75" x2="115" y2="95" class="arrow" />
  <text x="72" y="66" class="text">leseIndex</text>

  <line x1="665" y1="75" x2="665" y2="95" class="arrow2" />
  <text x="602" y="66" class="text">schreibIndex</text>

  <text x="60" y="220" class="text">Wenn das Ende erreicht ist, springt der nächste Index wieder an den Anfang.</text>
</svg>
